# Image generation
#
# OCCA-provided tool for turning a text prompt into a hosted image URL. Backed
# by the in-process `image` handler: it calls a generation model (Gemini
# "Nano Banana" gemini-2.5-flash-image by default), then POSTs the bytes to a
# configured media receiver that hosts them and returns { url }. OCCA holds no
# blob storage, so the publisher hosts its own media.
#
# Embedded today. When a standalone `mcp-occa-image` server lands, flip
# `implementation` to { kind: mcp, ... } without touching other code.

type: image
displayName: "Image generation"
description: "Generate an image from a text prompt and get back its hosted public URL. House style is locked in config; the caller supplies only the subject."

implementation:
  kind: embedded
  handler: image

credentialFields:
  - name: geminiApiKey
    type: string
    required: true
    secret: true
    description: "Google Generative Language API key used to generate the image."
  - name: uploadEndpoint
    type: string
    required: true
    secret: false
    description: "The media receiver the generated bytes are POSTed to. Must return { url } on success."
  - name: uploadSecret
    type: string
    required: true
    secret: true
    description: "Shared secret used to HMAC-sign the upload request so the receiver can verify it."

metadataFields:
  - name: model
    type: string
    required: false
    secret: false
    description: "Model id (default gemini-2.5-flash-image, a.k.a. Nano Banana)."
  - name: styleTemplate
    type: string
    required: false
    secret: false
    description: "Locked house style, prefixed to every prompt so a series stays on-brand."
  - name: aspectRatio
    type: string
    required: false
    secret: false
    description: "Aspect ratio for the image, e.g. 16:9 for a wide thumbnail."

actions:
  - name: generate
    description: "Generate an image for a subject and return its hosted public URL."

hasDynamicActions: false
hasTestConnection: true
