# Image generation (OpenRouter)
#
# OCCA-provided tool for turning a text prompt into a hosted image URL. Backed
# by the in-process `image` handler: it calls OpenRouter's chat-completions
# image modality (model id is config, e.g. google/gemini-2.5-flash-image), then
# POSTs the bytes to a configured media receiver that hosts them and returns
# { url }. OCCA holds no blob storage, so the publisher hosts its own media.
#
# One concrete provider per catalog entry (the X-tool pattern). A native-Gemini
# or fal backend would be its own YAML, not a switch inside this one.

type: image
displayName: "Image generation (OpenRouter)"
description: "Generate an image from a text prompt via OpenRouter and get back its hosted public URL. House style is locked in config; the caller supplies only the subject."

implementation:
  kind: embedded
  handler: image

credentialFields:
  - name: apiKey
    type: string
    required: true
    secret: true
    description: "OpenRouter API key used to generate the image."
  - name: uploadEndpoint
    type: string
    required: true
    secret: false
    description: "The media receiver the generated bytes are POSTed to. Must return { url } on success."
  - name: uploadSecret
    type: string
    required: true
    secret: true
    description: "Shared secret used to HMAC-sign the upload request so the receiver can verify it."

metadataFields:
  - name: model
    type: string
    required: false
    secret: false
    description: "OpenRouter image model (default google/gemini-2.5-flash-image)."
  - name: styleTemplate
    type: string
    required: false
    secret: false
    description: "Locked house style, prefixed to every prompt so a series stays on-brand."
  - name: aspectRatio
    type: string
    required: false
    secret: false
    description: "Aspect ratio hint appended to the prompt, e.g. 16:9."

actions:
  - name: generate
    description: "Generate an image for a subject and return its hosted public URL."

hasDynamicActions: false
hasTestConnection: true
